baseURL = 'https://scienceonfire.github.io/hrchamorro/'
languageCode = 'en-us'
title = 'Harold R. Chamorro'
theme = 'LoveIt'
[params]
  version = '0.2.X'
  defaultTheme = 'auto'
  [params.home]
    [params.home.profile]
      enable = true
      avatarURL = 'images/profile.svg'
      title = 'Harold R. Chamorro'
      subtitle = 'Power Systems · Applied Mathematics · Control Theory'
      social = true
    [params.home.posts]
      enable = true
  [params.social]
    GitHub = 'ScienceOnFire'
    GoogleScholar = 'ZKoYASsAAAAJ'
  [params.search]
    enable = true
    type = 'lunr'
  [params.page.math]
    enable = true
[outputs]
  home = ['HTML', 'RSS', 'JSON']
[markup.goldmark.renderer]
  unsafe = true
